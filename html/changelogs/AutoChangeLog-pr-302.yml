author: "EnderMage99"
delete-after: True
changes:
  - rscadd: "Added Grid Crafting System - a new way to craft City weapons using Navigation Cores"
  - rscadd: "Navigation Core Templates purchasable from Template Vendor machines using Ahn"
  - rscadd: "7 movement types based on sins (Charge, Attract, Shuffle, Expand, Drift, Teleport, Mirror)"
  - rscadd: "Chemical quantity affects core distance (5u=50%, 15u=100%, 25u=150%)"
  - rscadd: "Weapon tiers unlocked by completing ordeals (Dawn=T1, Noon=T2, Dusk=T3, Midnight=T4)"
  - rscadd: "Diminishing returns system discourages spamming the same movement type"
  - rscadd: "Shuffle system randomizes weapon positions after crafting enough weapons"
  - rscadd: "ZAYIN abnormality chemicals can be used to create navigation cores"
  - rscadd: "Grid Crafting Station machine with TGUI interface showing map, weapons, and controls"